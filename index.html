<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>TíchGóp • Quản Lý Chi Tiêu Gia Đình</title>
    <meta
      name="description"
      content="PWA quản lý chi tiêu gia đình hiện đại, tự động tổng hợp theo ngày, tuần, tháng và phân loại rõ ràng."
    />
    <meta name="theme-color" content="#f5f7fb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TíchGóp" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('tikgop_family_finance_v2');
          var theme = 'system';
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.settings && parsed.settings.theme) {
              theme = parsed.settings.theme;
            }
          }
          var isDark =
            theme === 'dark' ||
            (theme === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#070a10');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-emerald-500/20 selection:text-emerald-700 dark:selection:bg-emerald-400/25 dark:selection:text-emerald-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
