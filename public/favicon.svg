<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="55%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="coin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="120" fill="url(#bg)" />
  <rect width="512" height="256" rx="120" fill="url(#shine)" />
  <!-- House + Wallet Silhouette -->
  <path
    d="M116 244 L256 128 L396 244"
    fill="none"
    stroke="#ffffff"
    stroke-width="30"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <rect
    x="146"
    y="224"
    width="220"
    height="168"
    rx="38"
    fill="#ffffff"
    fill-opacity="0.96"
  />
  <!-- Wallet clasp -->
  <rect x="292" y="282" width="84" height="54" rx="22" fill="#059669" />
  <circle cx="322" cy="309" r="11" fill="#ecfdf5" />
  <!-- Golden saving coin floating into roof -->
  <circle cx="256" cy="184" r="34" fill="url(#coin)" stroke="#ffffff" stroke-width="8" />
  <path
    d="M256 168 v32 M246 177 h20 M246 191 h20"
    stroke="#92400e"
    stroke-width="6"
    stroke-linecap="round"
  />
  <!-- Rising bar spark inside house -->
  <rect x="184" y="314" width="22" height="42" rx="11" fill="#10b981" fill-opacity="0.45" />
  <rect x="218" y="292" width="22" height="64" rx="11" fill="#10b981" fill-opacity="0.72" />
  <rect x="252" y="266" width="22" height="90" rx="11" fill="#059669" />
